<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Mani - Fixed Ads</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/sdk/v1/adsgram.js"></script>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid #3b82f6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #coin-count {
            font-size: 35px;
            color: #fbbf24;
            font-weight: bold;
            display: block;
        }
        .ad-btn {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }
        .btn-video { background: #059669; } /* Rewarded */
        .btn-inter { background: #2563eb; } /* Interstitial */
        .ad-btn:active { transform: scale(0.96); }
        .status-msg { font-size: 13px; color: #94a3b8; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="balance-card">
        <span>আপনার বর্তমান ব্যালেন্স</span>
        <span id="coin-count">0</span>
        <small>Coins</small>
    </div>

    <h3>অ্যাড দেখে ইনকাম শুরু করুন</h3>

    <button class="ad-btn btn-video" onclick="showAdsgram('29577', 'reward')">
        🎥 Watch Video (Big Reward)
    </button>

    <button class="ad-btn btn-inter" onclick="showAdsgram('29578', 'inter')">
        🖼️ Show Interstitial Ad
    </button>

    <p id="status" class="status-msg">সিস্টেম প্রস্তুত...</p>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // লোকাল স্টোরেজ থেকে কয়েন লোড
        let balance = parseInt(localStorage.getItem('user_balance')) || 0;
        document.getElementById('coin-count').innerText = balance;

        async function showAdsgram(blockId, type) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "অ্যাড লোড হচ্ছে...";
            statusEl.style.color = "#fbbf24";

            // Adsgram Initializer
            const AdController = window.Adsgram.init({
                blockId: blockId,
                debug: false // অ্যাড শো না হলে এখানে true করে এরর দেখতে পারেন
            });

            try {
                const result = await AdController.show();
                
                // অ্যাড সফলভাবে দেখা শেষ হলে
                statusEl.innerText = "অ্যাড সফল! রিওয়ার্ড যোগ করা হয়েছে।";
                statusEl.style.color = "#10b981";

                let reward = (type === 'reward') ? 100 : 20;
                balance += reward;
                
                // লোকাল স্টোরেজে সেভ
                localStorage.setItem('user_balance', balance);
                document.getElementById('coin-count').innerText = balance;

                tg.HapticFeedback.notificationOccurred('success');
                alert("অভিনন্দন! আপনি " + reward + " কয়েন পেয়েছেন।");

            } catch (error) {
                // এরর হ্যান্ডেলিং
                console.error(error);
                statusEl.style.color = "#ef4444";

                if (error.error === "not_found") {
                    statusEl.innerText = "দুঃখিত, এই মুহূর্তে কোনো অ্যাড নেই।";
                } else if (error.error === "closedByUser") {
                    statusEl.innerText = "অ্যাডটি সম্পূর্ণ না দেখলে রিওয়ার্ড পাবেন না।";
                } else {
                    statusEl.innerText = "অ্যাড লোড হতে সমস্যা হচ্ছে। ডোমেইন চেক করুন।";
                }
            }
        }
    </script>
</body>
</html>
